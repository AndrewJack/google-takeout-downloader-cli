name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# One release at a time: a newer release waits for the running one instead of cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    name: build (${{ matrix.target }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Check tag matches Cargo.toml version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="takeout-dl-${TAG}-${TARGET}"
          mkdir "$name"
          cp README.md "target/$TARGET/release/takeout-dl" "$name/"
          archive="$name.tar.gz"
          tar czf "$archive" "$name"
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  # Only this job gets write access, and it runs no third-party actions or build code.
  publish:
    name: upload release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
