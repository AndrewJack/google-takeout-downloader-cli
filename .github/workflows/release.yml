name: Release

# Merging a PR that bumps `version` in Cargo.toml publishes vX.Y.Z with generated notes.
# Run it manually (Actions tab) to retry a release whose build failed.
# Build and publish live in one workflow because a release created with GITHUB_TOKEN
# doesn't trigger other workflows.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: a newer run waits for the running one instead of cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: detect version bump
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Releasing whenever no release exists for the current version (rather than diffing the
      # previous commit) also covers retries after a failed build.
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml version '$version' is not X.Y.Z"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $tag."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/checks.yml

  build:
    name: build (${{ matrix.target }})
    needs: [detect, checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="takeout-dl-${TAG}-${TARGET}"
          mkdir "$name"
          cp README.md LICENSE "target/$TARGET/release/takeout-dl" "$name/"
          archive="$name.tar.gz"
          tar czf "$archive" "$name"
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  # Only this job gets write access, and it runs no third-party actions or build code.
  # It creates the tag too, so a failed build leaves no tag or partial release behind.
  publish:
    name: create release
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          SHA: ${{ github.sha }}
        run: gh release create "$TAG" dist/* --target "$SHA" --title "$TAG" --generate-notes
